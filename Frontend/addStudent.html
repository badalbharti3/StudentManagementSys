<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto mt-10 bg-white shadow-lg rounded-lg p-6">
        <h1 class="text-2xl font-bold mb-6 text-center">Add New Student</h1>

        <form id="studentForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">ID:</label>
                <input type="text" id="id" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Name:</label>
                <input type="text" id="name" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Age:</label>
                <input type="number" id="age" required min="1" max="100"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Email:</label>
                <input type="email" id="email" required 
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>

            <div class="flex gap-4">
                <button type="submit" 
                        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                    Submit
                </button>
                <button type="button" onclick="window.location.href='index.html'"
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                    Cancel
                </button>
            </div>
        </form>

        <div id="message" class="mt-4 text-center font-semibold"></div>
    </div>

    <script>
        document.getElementById("studentForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const studentData = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                age: parseInt(document.getElementById("age").value),
                email: document.getElementById("email").value
            };

            fetch("http://localhost:8080/add-student", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(studentData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error("Failed to add student");
            })
            .then(data => {
                document.getElementById("message").innerHTML = 
                    '<span class="text-green-600">Student added successfully!</span>';
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            })
            .catch(error => {
                document.getElementById("message").innerHTML = 
                    '<span class="text-red-600">Error: ' + error.message + '</span>';
            });
        });
    </script>

</body>
</html>
