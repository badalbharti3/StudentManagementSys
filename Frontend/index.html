<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Header with Logout Button -->
    <div class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Student Management System</h2>
            <button onclick="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                🚪 Logout
            </button>
        </div>
    </div>

    <!-- Update Student Modal -->
    <div id="updateModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3">
                <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Update Student</h3>
                <div class="mt-2">
                    <input type="hidden" id="updateStudentId">
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                        <input type="text" id="updateName" 
                               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Age</label>
                        <input type="number" id="updateAge" min="5" max="90"
                               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="updateEmail"
                               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    </div>
                </div>
                
                <div class="flex justify-end gap-2 mt-4">
                    <button onclick="closeUpdateModal()" 
                            class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                        Cancel
                    </button>
                    <button onclick="submitUpdate()" 
                            class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                        Update
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto mt-10 bg-white shadow-lg rounded-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold text-center flex-1">Student List</h1>
            <button onclick="window.location.href='addStudent.html'" 
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                Add Student
            </button>
        </div>

        <table class="w-full border border-gray-200">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2 border">ID</th>
                    <th class="p-2 border">Name</th>
                    <th class="p-2 border">Age</th>
                    <th class="p-2 border">Email</th>
                    <th class="p-2 border">Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
                <!-- Data yaha aayega -->
            </tbody>
        </table>
    </div>

    <script>
        // Check if user is logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                alert('Please login first');
                window.location.href = 'login.html';
            }
        });

        // Logout function
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userEmail');
            alert('Logged out successfully');
            window.location.href = 'login.html';
        }

        // Helper function to get auth headers
        function getAuthHeaders() {
            const token = localStorage.getItem('authToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function openUpdateModal(id, name, age, email) {
            document.getElementById('updateStudentId').value = id;
            document.getElementById('updateName').value = name;
            document.getElementById('updateAge').value = age;
            document.getElementById('updateEmail').value = email;
            document.getElementById('updateModal').classList.remove('hidden');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.add('hidden');
        }

        function submitUpdate() {
            const id = document.getElementById('updateStudentId').value;
            const name = document.getElementById('updateName').value;
            const age = document.getElementById('updateAge').value;
            const email = document.getElementById('updateEmail').value;

            // Create update object with only filled fields
            const updateData = {};
            if (name.trim()) updateData.name = name;
            if (age) updateData.age = parseInt(age);
            if (email.trim()) updateData.email = email;

            fetch(`http://localhost:8080/students/${id}`, {
                method: 'PATCH',
                headers: getAuthHeaders(),
                body: JSON.stringify(updateData)
            })
            .then(response => {
                if (response.ok) {
                    alert('Student updated successfully!');
                    closeUpdateModal();
                    location.reload();
                } else {
                    return response.json().then(err => {
                        alert('Failed to update student: ' + (err.message || 'Unknown error'));
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error updating student');
            });
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                fetch(`http://localhost:8080/students/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                })
                .then(response => {
                    if (response.ok) {
                        alert('Student deleted successfully!');
                        location.reload();
                    } else {
                        alert('Failed to delete student');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting student');
                });
            }
        }

        fetch("http://localhost:8080/students", {
            headers: getAuthHeaders()
        })

            .then(response => response.json())
            .then(data => {
                const table = document.getElementById("studentTable");

                data.forEach((student, index) => {
                    const row = `
                        <tr class="text-center">
                            <td class="border p-2">${index + 1}</td>
                            <td class="border p-2">${student.name}</td>
                            <td class="border p-2">${student.age}</td>
                            <td class="border p-2">${student.email}</td>
                            <td class="border p-2">
                                <button onclick="openUpdateModal('${student.id}', '${student.name}', ${student.age}, '${student.email}')" 
                                        class="bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-3 rounded mr-2">
                                    Update
                                </button>
                                <button onclick="deleteStudent('${student.id}')" 
                                        class="bg-red-500 hover:bg-red-600 text-white font-bold py-1 px-3 rounded">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    table.innerHTML += row;
                });
            })
            .catch(error => console.error("Error:", error));
    </script>

</body>
</html>
