<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-green-400 to-blue-500 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-2xl rounded-lg p-8 w-96">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Register</h1>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Username:</label>
                <input type="text" id="username" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                       placeholder="Enter your username">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Email:</label>
                <input type="email" id="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                       placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Password:</label>
                <input type="password" id="password" required minlength="6"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                       placeholder="Enter your password (min 6 characters)">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Confirm Password:</label>
                <input type="password" id="confirmPassword" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                       placeholder="Confirm your password">
            </div>

            <button type="submit"
                    class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Register
            </button>
        </form>

        <div id="message" class="mt-4 text-center font-semibold"></div>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Already have an account?
                <a href="login.html" class="text-green-500 hover:text-green-700 font-semibold">Login here</a>
            </p>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'index.html';
            }
        });

        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Validate passwords match
            if (password !== confirmPassword) {
                document.getElementById("message").innerHTML =
                    '<span class="text-red-600">Passwords do not match!</span>';
                return;
            }

            const registerData = {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                password: password
            };

            // Show loading message
            document.getElementById("message").innerHTML =
                '<span class="text-blue-600">Creating account...</span>';

            fetch("http://localhost:8080/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(registerData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else if (response.status === 400) {
                    throw new Error("User already exists or invalid data");
                } else {
                    throw new Error("Registration failed. Please try again.");
                }
            })
            .then(data => {
                // Store the JWT token in localStorage
                localStorage.setItem('authToken', data.token);

                // Optional: Store user email
                localStorage.setItem('userEmail', registerData.email);

                document.getElementById("message").innerHTML =
                    '<span class="text-green-600">Registration successful! Redirecting...</span>';

                // Redirect to main page after 1 second
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    '<span class="text-red-600">Error: ' + error.message + '</span>';
            });
        });
    </script>

</body>
</html>
