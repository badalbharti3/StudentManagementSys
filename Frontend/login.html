<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-400 to-purple-500 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-2xl rounded-lg p-8 w-96">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Login</h1>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Email:</label>
                <input type="email" id="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Enter your email">
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">Password:</label>
                <input type="password" id="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Enter your password">
            </div>

            <button type="submit"
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Login
            </button>
        </form>

        <div id="message" class="mt-4 text-center font-semibold"></div>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Don't have an account?
                <a href="register.html" class="text-blue-500 hover:text-blue-700 font-semibold">Register here</a>
            </p>
        </div>
    </div>

    <script>
        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'index.html';
            }
        });

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const loginData = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            // Show loading message
            document.getElementById("message").innerHTML =
                '<span class="text-blue-600">Logging in...</span>';

            fetch("http://localhost:8080/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(loginData)
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else if (response.status === 401) {
                    throw new Error("Invalid email or password");
                } else {
                    throw new Error("Login failed. Please try again.");
                }
            })
            .then(data => {
                // Store the JWT token in localStorage
                localStorage.setItem('authToken', data.token);

                // Optional: Store user email
                localStorage.setItem('userEmail', loginData.email);

                document.getElementById("message").innerHTML =
                    '<span class="text-green-600">Login successful! Redirecting...</span>';

                // Redirect to main page after 1 second
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    '<span class="text-red-600">Error: ' + error.message + '</span>';
            });
        });
    </script>

</body>
</html>
